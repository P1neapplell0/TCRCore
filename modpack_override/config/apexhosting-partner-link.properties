# Apex Hosting Partner Link configuration

# ---------------------------------------------------------------------------
# User Settings
# ---------------------------------------------------------------------------

# Default currency displayed in the server configurator.
currency=USD
# If disabled, the Apex Hosting button is hidden from the server list.
show_button=true


# ---------------------------------------------------------------------------
# Partner Settings
# ---------------------------------------------------------------------------

# How to find your affiliate ID:
# 1. Log in to the Apex Hosting Billing Panel: https://billing.apexminecrafthosting.com/
# 2. Find the "Affiliate Program" box and select "More Details".
# 3. Locate your unique affiliate link.
# 4. Your affiliate ID is the sequence of digits after "aff=" in the link.
# Contact your partner manager if you need assistance.
affiliate_id=16041

# If enabled, the server list button opens the affiliate link directly
skip_configurator=false


# ---------------------------------------------------------------------------
# Modpack Settings
# ---------------------------------------------------------------------------

# Optional project ID used to load the modpack logo.
# You can also put a logo.png in /config/apexhosting-partner-link
curseforge_project_id=1354886
modrinth_project_id=

# Short modpack name used in the server configurator.
modpack_name=NightfallCraft - The Casket of Reveries
# Apex Hosting server version (internal name) used to preload the modpack during checkout.
# Contact your partner manager if you need assistance.
server_version=The_Casket_of_Reveries.jar
# You can promote your own discount code, if you have one.
discount_code=NIGHT50
discount_code_value=50
# Minimum RAM requirement, in GB. Must not exceed recommended_ram.
minimum_ram=6
# Default RAM recommendation, in GB.
recommended_ram=8
